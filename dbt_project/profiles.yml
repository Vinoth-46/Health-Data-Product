github_health:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('ANALYTICS_USER', 'analytics_user') }}"
      password: "{{ env_var('ANALYTICS_PASSWORD', 'analytics_password') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('ANALYTICS_DB', 'analytics_dw') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
    docker:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      user: "{{ env_var('ANALYTICS_USER', 'analytics_user') }}"
      password: "{{ env_var('ANALYTICS_PASSWORD', 'analytics_password') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('ANALYTICS_DB', 'analytics_dw') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
    ci:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      user: "{{ env_var('ANALYTICS_USER', 'postgres') }}"
      password: "{{ env_var('ANALYTICS_PASSWORD', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      dbname: "{{ env_var('ANALYTICS_DB', 'analytics_dw') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
