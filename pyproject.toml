[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "health-data-product"
version = "1.0.0"
description = "Red Hat Ecosystem Health Data Product with Airflow, PostgreSQL, dbt, and LLM Insights"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vinoth" }]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = ["ignore::DeprecationWarning"]
